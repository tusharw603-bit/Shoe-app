<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrideUp – Shoe Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f6f7fb; color: #1c1c28; }
    header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .logo { font-size: 1.4rem; font-weight: 800; color: #ff5a3c; }
    .cart-btn { position: relative; border: none; background: #1c1c28; color: #fff; padding: 10px 16px; border-radius: 999px; cursor: pointer; font-size: .95rem; }
    .cart-count { background: #ff5a3c; border-radius: 999px; padding: 2px 8px; margin-left: 6px; font-size: .8rem; }
    .hero { text-align: center; padding: 40px 20px 20px; }
    .hero h1 { font-size: 2rem; }
    .hero p { color: #666; margin-top: 8px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px 20px 20px; }
    .controls input, .controls select { padding: 10px 14px; border: 1px solid #ddd; border-radius: 10px; font-size: .95rem; background: #fff; }
    .controls input { min-width: 220px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; padding: 0 20px 40px; max-width: 1100px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.06); display: flex; flex-direction: column; transition: transform .15s; }
    .card:hover { transform: translateY(-4px); }
    .img { height: 160px; display: grid; place-items: center; font-size: 4.5rem; }
    .info { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .brand { font-size: .75rem; color: #888; text-transform: uppercase; letter-spacing: .05em; }
    .name { font-weight: 700; }
    .price { font-weight: 800; color: #ff5a3c; }
    .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
    .size { border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 4px 8px; font-size: .8rem; cursor: pointer; }
    .size.active { background: #1c1c28; color: #fff; border-color: #1c1c28; }
    .add { margin-top: auto; border: none; background: #ff5a3c; color: #fff; padding: 10px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .add:hover { background: #e84a2d; }
    .empty { grid-column: 1 / -1; text-align: center; color: #888; padding: 40px; }

    /* Cart drawer */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
    .overlay.show { opacity: 1; pointer-events: auto; }
    .drawer { position: fixed; top: 0; right: -420px; width: min(400px, 100%); height: 100%; background: #fff; z-index: 30; transition: right .25s; display: flex; flex-direction: column; }
    .drawer.open { right: 0; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #eee; }
    .close { border: none; background: none; font-size: 1.5rem; cursor: pointer; }
    .items { flex: 1; overflow-y: auto; padding: 10px 20px; }
    .item { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .item .thumb { font-size: 2rem; }
    .item .meta { flex: 1; font-size: .9rem; }
    .qty { display: flex; align-items: center; gap: 6px; }
    .qty button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    .drawer-foot { padding: 16px 20px; border-top: 1px solid #eee; }
    .total { display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem; margin-bottom: 12px; }
    .checkout { width: 100%; border: none; background: #1c1c28; color: #fff; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; }
    footer { text-align: center; padding: 20px; color: #888; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <div class="logo">👟 StrideUp</div>
    <button class="cart-btn" id="openCart">Cart <span class="cart-count" id="cartCount">0</span></button>
  </header>

  <section class="hero">
    <h1>Find your perfect pair</h1>
    <p>Sneakers, running shoes, boots &amp; more.</p>
  </section>

  <div class="controls">
    <input type="search" id="search" placeholder="Search shoes..." />
    <select id="category">
      <option value="all">All categories</option>
      <option value="Sneakers">Sneakers</option>
      <option value="Running">Running</option>
      <option value="Boots">Boots</option>
      <option value="Formal">Formal</option>
    </select>
    <select id="sort">
      <option value="default">Sort: Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
    </select>
  </div>

  <main class="grid" id="grid"></main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-head"><h2>Your Cart</h2><button class="close" id="closeCart">&times;</button></div>
    <div class="items" id="items"></div>
    <div class="drawer-foot">
      <div class="total"><span>Total</span><span id="total">$0.00</span></div>
      <button class="checkout" id="checkout">Checkout</button>
    </div>
  </aside>

  <footer>&copy; 2026 StrideUp. Demo project.</footer>

  <script>
    const products = [
      { id: 1, name: "AirFlex Runner", brand: "StrideUp", category: "Running", price: 89.99, emoji: "👟", bg: "#ffe3dc" },
      { id: 2, name: "Urban Classic", brand: "StrideUp", category: "Sneakers", price: 69.5, emoji: "👟", bg: "#dce9ff" },
      { id: 3, name: "Trail Master Boot", brand: "Summit", category: "Boots", price: 129.0, emoji: "🥾", bg: "#e5f5dc" },
      { id: 4, name: "Oxford Prime", brand: "Gentry", category: "Formal", price: 149.99, emoji: "👞", bg: "#f1e6dc" },
      { id: 5, name: "Speed Pro 2", brand: "Velo", category: "Running", price: 109.0, emoji: "👟", bg: "#fff4cc" },
      { id: 6, name: "Street Low Top", brand: "Velo", category: "Sneakers", price: 59.0, emoji: "👟", bg: "#f0dcff" },
      { id: 7, name: "Hiker Pro", brand: "Summit", category: "Boots", price: 139.0, emoji: "🥾", bg: "#dcf7f3" },
      { id: 8, name: "Derby Elite", brand: "Gentry", category: "Formal", price: 119.0, emoji: "👞", bg: "#e8e8e8" }
    ];
    const sizeOptions = [6, 7, 8, 9, 10, 11];

    let cart = JSON.parse(localStorage.getItem("shoeCart") || "[]");
    const selectedSize = {};

    const $ = (id) => document.getElementById(id);
    const money = (n) => "$" + n.toFixed(2);

    function renderProducts() {
      const q = $("search").value.trim().toLowerCase();
      const cat = $("category").value;
      const sort = $("sort").value;

      let list = products.filter(p =>
        (cat === "all" || p.category === cat) &&
        (p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q))
      );
      if (sort === "low") list.sort((a, b) => a.price - b.price);
      if (sort === "high") list.sort((a, b) => b.price - a.price);

      $("grid").innerHTML = list.length ? list.map(p => `
        <div class="card">
          <div class="img" style="background:${p.bg}">${p.emoji}</div>
          <div class="info">
            <span class="brand">${p.brand} · ${p.category}</span>
            <span class="name">${p.name}</span>
            <span class="price">${money(p.price)}</span>
            <div class="sizes">
              ${sizeOptions.map(s => `<button class="size ${selectedSize[p.id] === s ? "active" : ""}" onclick="pickSize(${p.id}, ${s})">${s}</button>`).join("")}
            </div>
            <button class="add" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>`).join("") : `<div class="empty">No shoes found.</div>`;
    }

    function pickSize(id, size) { selectedSize[id] = size; renderProducts(); }

    function addToCart(id) {
      const size = selectedSize[id];
      if (!size) { alert("Please select a size first."); return; }
      const existing = cart.find(i => i.id === id && i.size === size);
      if (existing) existing.qty++;
      else cart.push({ id, size, qty: 1 });
      saveCart(); openCart();
    }

    function changeQty(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveCart();
    }

    function saveCart() {
      localStorage.setItem("shoeCart", JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const count = cart.reduce((s, i) => s + i.qty, 0);
      $("cartCount").textContent = count;
      let total = 0;
      $("items").innerHTML = cart.length ? cart.map((item, idx) => {
        const p = products.find(x => x.id === item.id);
        total += p.price * item.qty;
        return `
          <div class="item">
            <div class="thumb">${p.emoji}</div>
            <div class="meta"><strong>${p.name}</strong><br>Size ${item.size} · ${money(p.price)}</div>
            <div class="qty">
              <button onclick="changeQty(${idx}, -1)">−</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${idx}, 1)">+</button>
            </div>
          </div>`;
      }).join("") : `<p class="empty">Your cart is empty.</p>`;
      $("total").textContent = money(total);
    }

    function openCart() { $("drawer").classList.add("open"); $("overlay").classList.add("show"); }
    function closeCart() { $("drawer").classList.remove("open"); $("overlay").classList.remove("show"); }

    $("openCart").onclick = openCart;
    $("closeCart").onclick = closeCart;
    $("overlay").onclick = closeCart;
    $("checkout").onclick = () => {
      if (!cart.length) return alert("Your cart is empty.");
      alert("Thanks for your order! (Demo only)");
      cart = []; saveCart(); closeCart();
    };
    ["search", "category", "sort"].forEach(id => $(id).addEventListener("input", renderProducts));

    renderProducts();
    renderCart();
  </script>
</body>
</html>
